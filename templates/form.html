<script>
function addEducationRow() {
    var table = document.getElementById("eduTable");
    var row = table.insertRow(-1);

    row.innerHTML = `
        <td><input type="text" name="degree"></td>
        <td><input type="text" name="institute"></td>
        <td><input type="text" name="year"></td>
        <td><input type="text" name="percentage"></td>
    `;
}

function addExperienceRow() {
    var table = document.getElementById("expTable");
    var row = table.insertRow(-1);

    row.innerHTML = `
        <td><input type="text" name="company"></td>
        <td><input type="text" name="role"></td>
        <td><input type="text" name="duration"></td>
        <td><input type="text" name="description"></td>
    `;
}

function toggleProjectBox() {
    var option = document.getElementById("projectOption").value;
    var box = document.getElementById("projectBox");

    if(option === "yes") {
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }
}

function generateObjective() {
    let objectives = [
        "Motivated and detail-oriented professional seeking an opportunity to apply my skills and knowledge in a reputed organization while contributing to its growth and success.",
        "To obtain a responsible position where I can utilize my education, skills and abilities for professional growth and contribute effectively to the organization.",
        "Hardworking and quick-learning candidate looking for an opportunity to work in a professional environment and enhance my knowledge, skills and experience.",
        "Dedicated and result-oriented individual seeking a challenging role where I can contribute to organizational success through commitment, teamwork and continuous learning."
    ];

    let randomObjective = objectives[Math.floor(Math.random() * objectives.length)];
    document.getElementById("objective").value = randomObjective;
}
</script>
